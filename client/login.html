<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="style.css?v=20260703-login-fix">
    <link rel="icon" href="data:,">

</head>

<body>

    <div class="login-container">

        <form id="loginForm"
        class="login-box">

            <h1>Company Search</h1>

            <input
            type="text"
            id="username"
            placeholder="Username"
            required>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <button type="submit">

                Login

            </button>

        </form>

    </div>

    <script src="login.js?v=20260703-login-fix"></script>

</body>

</html>
